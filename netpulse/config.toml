[general]
# Primary network interface for packet capture (leave empty for auto-detect)
interface = ""

# Alert mode: "alert" for anomaly detection, "capture" for baseline collection
mode = "capture"

# Scoring window in seconds
scoring_window = 30

# Ring buffer duration in minutes
buffer_duration = 5

[models]
# Anomaly thresholds
isolation_forest_contamination = 0.01
autoencoder_bottleneck = 8
autoencoder_epochs = 30
autoencoder_batch_size = 512
autoencoder_learning_rate = 0.001

# Combined score threshold (alert if combined_score > 1.0)
combined_threshold = 1.0

# Model weights for combined score
if_weight = 0.5
ae_weight = 0.5

[retraining]
# Nightly retraining schedule (24-hour format)
retrain_hour = 2
retrain_minute = 0

# Maximum acceptable F1 degradation (0.05 = 5%)
max_f1_regression = 0.05

# Days of traffic to use for retraining
retrain_window_days = 7

[alerts]
# SQLite database path
db_path = "~/.netpulse/alerts.db"

# Optional webhook URL for alert notifications
webhook_url = ""

# Enable terminal alerts via rich
terminal_alerts = true

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
level = "INFO"

# Log file path
log_path = "~/.netpulse/netpulse.log"
